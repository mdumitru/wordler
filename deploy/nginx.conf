server {
    # IPv4 only: the container may run without IPv6, where an [::] listener
    # would stop nginx from starting.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    # Liveness probe for the container HEALTHCHECK and orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed bundle files never change, so browsers may cache them forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Word lists keep their names across deploys; cache them briefly.
    location /words/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deploys are picked up.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Analytics routes are served by the Caddy front in deploy/compose.yaml.
    # Without it they must 404, not fall back to the app shell.
    location /stats/ {
        return 404;
    }

    # Single-page app: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

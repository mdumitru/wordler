# Security headers for every response. nginx drops server-level add_header
# directives in any location that sets its own, so nginx.conf includes this
# file at server level and again in each such location.
#
# The script-src hash allows the inline theme script in public/index.html.
# It must be recomputed whenever that script changes (see deploy/README.md),
# or the browser will block it and the page will flash the light theme.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0iT6ZHf2G+LlAz/KEBOe4TCE4rnyu5dsoa7qhhzvz6Q='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Strict-Transport-Security is left to the TLS terminator in front of this
# container; it is meaningless over the plain HTTP served here.
